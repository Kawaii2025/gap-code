<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GapCode - 填空式算法刷题平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // 仿LeetCode经典蓝色主调
            gapcode: '#0070f3',
            easy: '#00b894',
            medium: '#f39c12',
            hard: '#e74c3c',
          },
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .main-h {
        height: calc(100vh - 64px);
      }
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
  <!-- 顶部导航 复刻LeetCode -->
  <header class="sticky top-0 z-50 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo -->
        <div class="flex items-center">
          <a href="#" class="flex items-center">
            <span class="text-gapcode text-2xl font-bold">GapCode</span>
          </a>
          <nav class="hidden md:ml-8 md:flex space-x-6">
            <a href="#problems" class="text-gray-700 dark:text-gray-300 hover:text-gapcode px-3 py-2 text-sm font-medium">题库</a>
            <a href="#" class="text-gray-700 dark:text-gray-300 hover:text-gapcode px-3 py-2 text-sm font-medium">竞赛</a>
            <a href="#" class="text-gray-700 dark:text-gray-300 hover:text-gapcode px-3 py-2 text-sm font-medium">题解</a>
          </nav>
        </div>
        
        <div class="flex items-center space-x-4">
          <!-- 主题切换 -->
          <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700">
            <i class="fa fa-moon-o dark:hidden"></i>
            <i class="fa fa-sun-o hidden dark:inline-block"></i>
          </button>
          
          <div id="auth-buttons" class="flex items-center space-x-2">
            <button class="px-3 py-1.5 text-sm font-medium text-gray-700 dark:text-gray-300 hover:text-gapcode">登录</button>
            <button class="px-3 py-1.5 text-sm font-medium bg-gapcode text-white rounded hover:bg-gapcode/90">注册</button>
          </div>
          <div id="user-info" class="hidden items-center space-x-2">
            <img src="https://picsum.photos/id/1005/40/40" class="w-8 h-8 rounded-full">
            <span class="hidden md:inline-block">用户</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- 题目列表页 -->
    <div id="problems-page">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-semibold">题库</h1>
        <div class="flex gap-2">
          <input placeholder="搜索题目" class="px-3 py-2 rounded border dark:bg-gray-800 dark:border-gray-600 outline-none">
          <select class="px-3 py-2 rounded border dark:bg-gray-800 dark:border-gray-600">
            <option>全部难度</option>
            <option>简单</option>
            <option>中等</option>
            <option>困难</option>
          </select>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded shadow">
        <table class="w-full">
          <thead class="border-b dark:border-gray-700">
            <tr class="text-left text-sm text-gray-500 dark:text-gray-400">
              <th class="px-4 py-3 font-normal">状态</th>
              <th class="px-4 py-3 font-normal">题号</th>
              <th class="px-4 py-3 font-normal">标题</th>
              <th class="px-4 py-3 font-normal">难度</th>
              <th class="px-4 py-3 font-normal">通过率</th>
            </tr>
          </thead>
          <tbody id="problem-list">
            <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer problem-item" data-id="1">
              <td class="px-4 py-3"><i class="fa fa-circle-o text-gray-400"></i></td>
              <td class="px-4 py-3 text-sm">1</td>
              <td class="px-4 py-3 text-sm hover:text-gapcode">两数之和（填空模板版）</td>
              <td class="px-4 py-3"><span class="text-easy text-sm">简单</span></td>
              <td class="px-4 py-3 text-sm text-gray-500">49.3%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 做题详情页 默认隐藏 -->
    <div id="solve-page" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 main-h">
        <!-- 左侧题目描述 -->
        <div class="bg-white dark:bg-gray-800 rounded p-4 overflow-y-auto scrollbar-hide">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h2 class="text-lg font-semibold">1. 两数之和（填空模板版）</h2>
              <div class="mt-1">
                <span class="text-easy text-sm">简单</span>
                <span class="ml-3 text-sm text-gray-500">填空模板模式 · 无需从头编写</span>
              </div>
            </div>
            <button id="back-list" class="text-sm px-3 py-1 border rounded hover:bg-gray-100 dark:hover:bg-gray-700">返回</button>
          </div>

          <!-- 新手填空提示 -->
          <div class="p-3 bg-blue-50 dark:bg-gray-700 rounded my-4 text-sm">
            <p class="font-medium text-gapcode">💡 做题提示</p>
            <p class="mt-1">系统已为你生成完整代码框架，只需补全 <code class="px-1 rounded bg-gray-200 dark:bg-gray-600">return</code> 空缺部分即可。</p>
          </div>

          <div class="text-sm leading-relaxed">
            <p>给定一个整数数组 nums 和一个整数目标值 target，请你在该数组中找出 和为目标值 的那 两个 整数，并返回它们的数组下标。</p>
            <p class="mt-2">每种输入只会对应一个答案，同一个元素不能重复使用。</p>
            <pre class="mt-3 p-3 bg-gray-100 dark:bg-gray-700 rounded text-sm">输入：nums = [2,7,11,15], target = 9
输出：[0,1]</pre>
          </div>
        </div>

        <!-- 右侧编辑器区域 -->
        <div class="flex flex-col bg-white dark:bg-gray-800 rounded">
          <div class="flex items-center justify-between px-4 py-3 border-b dark:border-gray-700">
            <select id="lang-select" class="dark:bg-gray-700 rounded px-2 py-1 text-sm outline-none">
              <option>JavaScript</option>
            </select>
            <div class="flex gap-2">
              <button id="run-btn" class="px-3 py-1.5 text-sm border rounded hover:bg-gray-100 dark:hover:bg-gray-700">运行</button>
              <button id="submit-btn" class="px-3 py-1.5 text-sm bg-gapcode text-white rounded hover:bg-gapcode/90">提交</button>
            </div>
          </div>
          <div id="editor" class="flex-1"></div>
          <!-- 运行结果面板 -->
          <div id="res-panel" class="hidden border-t dark:border-gray-700 p-4 h-32 overflow-y-auto text-sm"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // 主题
    const toggleTheme = document.getElementById('theme-toggle');
    toggleTheme.onclick = () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      if(editor) monaco.editor.setTheme(localStorage.theme === 'dark' ? 'vs-dark' : 'vs-light');
    };
    if(localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)){
      document.documentElement.classList.add('dark');
    }

    // 页面切换
    const problemsPage = document.getElementById('problems-page');
    const solvePage = document.getElementById('solve-page');
    const backList = document.getElementById('back-list');
    document.querySelectorAll('.problem-item').forEach(item => {
      item.onclick = () => {
        problemsPage.classList.add('hidden');
        solvePage.classList.remove('hidden');
      };
    });
    backList.onclick = () => {
      solvePage.classList.add('hidden');
      problemsPage.classList.remove('hidden');
    };

    // 模拟登录切换
    document.getElementById('auth-buttons').onclick = function(){
      this.classList.add('hidden');
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('user-info').classList.add('flex');
    };

    // 初始化编辑器 预置填空模板
    let editor;
    require.config({ paths: { 'vs':'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function(){
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: `/**
 * @param {number[]} nums
 * @param {number} target
 * @return {number[]}
 */
var twoSum = function(nums, target) {
    for(let i = 0; i < nums.length; i++){
        for(let j = i + 1; j < nums.length; j++){
            if(nums[i] + nums[j] === target){
                // 请补全下方代码缺口
                return ________;
            }
        }
    }
    return [];
};`,
        language: 'javascript',
        theme: localStorage.theme === 'dark' ? 'vs-dark' : 'vs-light',
        minimap: {enabled: false},
        automaticLayout: true,
        fontSize:14
      });
    });

    // 判题逻辑
    const runBtn = document.getElementById('run-btn');
    const submitBtn = document.getElementById('submit-btn');
    const resPanel = document.getElementById('res-panel');

    function judge(type){
      resPanel.classList.remove('hidden');
      resPanel.innerHTML = '<div class="text-blue-500"><i class="fa fa-spinner fa-spin"></i> 正在评测...</div>';
      setTimeout(()=>{
        const code = editor.getValue();
        if(code.includes('[i,j]') || code.includes('[0,1]')){
          resPanel.innerHTML = `
            <div class="text-easy"><i class="fa fa-check-circle"></i> ${type==='submit'?'提交成功':'运行通过'}</div>
            <div class="mt-2 text-gray-600 dark:text-gray-300">输入：[2,7,11,15], 9<br>输出：[0,1]</div>
          `;
        }else{
          resPanel.innerHTML = `
            <div class="text-hard"><i class="fa fa-times-circle"></i> 答案错误</div>
            <div class="mt-2 text-gray-500">提示：返回两个下标组成的数组即可</div>
          `;
        }
      },600);
    }
    runBtn.onclick = ()=>judge('run');
    submitBtn.onclick = ()=>judge('submit');
  </script>
</body>
</html>
